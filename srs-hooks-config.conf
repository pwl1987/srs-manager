# SRS Manager HTTP Hooks 配置片段
# 将 http_hooks 合并到 SRS 的 vhost __defaultVhost__ 中。
# 如果 SRS Manager 不与 SRS 同机，请把 127.0.0.1:3001 改成 SRS 能访问到的 Manager 地址。

http_hooks {
    enabled on;
    on_publish     http://127.0.0.1:3001/api/hooks/on_publish;
    on_unpublish   http://127.0.0.1:3001/api/hooks/on_unpublish;
    on_play        http://127.0.0.1:3001/api/hooks/on_play;
    on_stop        http://127.0.0.1:3001/api/hooks/on_stop;
    timeout        3;
}

# v0.4 起 OUT-PUSH 默认由独立 Push Worker 管理，不需要开启 Dynamic Forward。
# 仅在仍有 execution_mode=srs_dynamic 的历史任务时，才保留下面的兼容配置：
#
# forward {
#     backend http://127.0.0.1:3001/api/forward;
#     timeout 3;
# }
