services:
  srs-manager:
    build:
      context: .
      target: web
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SRS_API_URL=http://host.docker.internal:1985/api/v1
      - SRS_API_TOKEN=${SRS_API_TOKEN:-}
      - SRS_API_USERNAME=${SRS_API_USERNAME:-}
      - SRS_API_PASSWORD=${SRS_API_PASSWORD:-}
      - ADMIN_USER=admin
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_TTL=7200
      - REFRESH_TOKEN_TTL=604800
      - CORS_ALLOWED_ORIGINS=http://localhost:3001
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  pull-worker:
    build:
      context: .
      target: pull-worker
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SRS_API_URL=http://host.docker.internal:1985/api/v1
      - SRS_API_TOKEN=${SRS_API_TOKEN:-}
      - SRS_API_USERNAME=${SRS_API_USERNAME:-}
      - SRS_API_PASSWORD=${SRS_API_PASSWORD:-}
      - SRS_RTMP_PUBLISH_BASE=rtmp://host.docker.internal:1935/live
      - PULL_WORKER_POLL_MS=2000
      - PULL_STARTUP_TIMEOUT_MS=15000
      - PULL_STOP_GRACE_MS=5000
      - PULL_MAX_BACKOFF_MS=30000
      - PULL_MAX_ATTEMPTS=8
    restart: always

  push-worker:
    build:
      context: .
      target: pull-worker
    command: ["node", "push-worker.js"]
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SRS_API_URL=http://host.docker.internal:1985/api/v1
      - SRS_API_TOKEN=${SRS_API_TOKEN:-}
      - SRS_API_USERNAME=${SRS_API_USERNAME:-}
      - SRS_API_PASSWORD=${SRS_API_PASSWORD:-}
      - SRS_RTMP_PULL_BASE=rtmp://host.docker.internal:1935/live
      - PUSH_WORKER_POLL_MS=2000
      - PUSH_STARTUP_CONFIRM_MS=3000
      - PUSH_STOP_GRACE_MS=5000
      - PUSH_MAX_BACKOFF_MS=30000
      - PUSH_MAX_ATTEMPTS=8
    restart: always

  transcode-worker:
    build:
      context: .
      target: pull-worker
    command: ["node", "transcode-worker.js"]
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SRS_API_URL=http://host.docker.internal:1985/api/v1
      - SRS_API_TOKEN=${SRS_API_TOKEN:-}
      - SRS_API_USERNAME=${SRS_API_USERNAME:-}
      - SRS_API_PASSWORD=${SRS_API_PASSWORD:-}
      - SRS_RTMP_PULL_BASE=rtmp://host.docker.internal:1935/live
      - SRS_RTMP_PUBLISH_BASE=rtmp://host.docker.internal:1935/live
      - TRANSCODE_WORKER_POLL_MS=2000
      - TRANSCODE_STARTUP_TIMEOUT_MS=15000
      - TRANSCODE_STOP_GRACE_MS=5000
      - TRANSCODE_MAX_BACKOFF_MS=30000
      - TRANSCODE_MAX_ATTEMPTS=8
    restart: always


  record-worker:
    build:
      context: .
      target: pull-worker
    command: ["node", "record-worker.js"]
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SRS_API_URL=http://host.docker.internal:1985/api/v1
      - SRS_API_TOKEN=${SRS_API_TOKEN:-}
      - SRS_API_USERNAME=${SRS_API_USERNAME:-}
      - SRS_API_PASSWORD=${SRS_API_PASSWORD:-}
      - SRS_RTMP_PULL_BASE=rtmp://host.docker.internal:1935/live
      - RECORD_STORAGE_ROOT=/app/data/recordings
      - RECORD_WORKER_POLL_MS=2000
      - RECORD_STOP_GRACE_MS=5000
      - RECORD_STALL_MS=30000
    restart: always
