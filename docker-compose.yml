services:
  srs-manager:
    build:
      context: .
      target: web
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SRS_API_URL=http://host.docker.internal:1985/api/v1
      - SRS_API_TOKEN=${SRS_API_TOKEN}
      - ADMIN_USER=admin
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_TTL=7200
      - REFRESH_TOKEN_TTL=604800
      - CORS_ALLOWED_ORIGINS=http://localhost:3001
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  pull-worker:
    build:
      context: .
      target: pull-worker
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SRS_API_URL=http://host.docker.internal:1985/api/v1
      - SRS_API_TOKEN=${SRS_API_TOKEN}
      - SRS_RTMP_PUBLISH_BASE=rtmp://host.docker.internal:1935/live
      - PULL_WORKER_POLL_MS=2000
      - PULL_STARTUP_TIMEOUT_MS=15000
      - PULL_STOP_GRACE_MS=5000
      - PULL_MAX_BACKOFF_MS=30000
      - PULL_MAX_ATTEMPTS=8
    restart: always
